refresh_rate: 30 seconds

appenders:
  console:
    kind: console
    encoder:
      pattern: " {h({l})} {M:>20} > {m}{n}"

  file:
    kind: file
    path: "log/log4rs-$TIME{%Y-%m-%d_%H-%M-%S}.log"
    encoder:
      pattern: "[{d(%+)(utc)}] {l} {M:>20} > {m}{n}"

  rollingfile:
    kind: rolling_file
    path: "log/rolling_file.log"
    encoder:
      pattern: "[{d(%+)(utc)}] {l:<5.5} {M:>20} > {m}{n}"
    policy:
      trigger:
        kind: time
        interval: 1 minute
      roller:
        kind: fixed_window
        pattern: "log/old-rolling_file-{}.log"
        base: 0
        count: 2

root:
  level: warn
  appenders:
    - console
    - file
    - rollingfile

loggers:
  globset:
    level: warn
  h2:
    level: warn
  hyper_util:
    level: warn
  tower:
    level: warn
