refresh_rate: 30 seconds

appenders:
  stdout:
    kind: console
    encoder:
      pattern: " {h({l})} {M:>20} > {m}{n}"
    filters:
      - kind: threshold
        level: debug
  file:
    kind: file
    path: "examples/log/log4rs-$TIME{%Y-%m-%d_%H-%M-%S}.log"
    encoder:
      pattern: "[{d(%Y-%m-%dT%H:%M:%S%.6f)} {h({l}):<5.5} {M}] {m}{n}"
  rollingfile:
    kind: rolling_file
    path: "log/rolling_file.log"
    encoder:
      pattern: "[{d(%Y-%m-%dT%H:%M:%S%.6f)} {h({l}):<5.5} {M}] {m}{n}"
    policy:
      trigger:
        kind: time
        interval: 1 minute
      roller:
        kind: fixed_window
        pattern: "log/old-rolling_file-{}.log"
        base: 0
        count: 2
root:
  level: debug
  appenders:
    - stdout
    - file
    - rollingfile
